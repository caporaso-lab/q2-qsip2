name: q2-qsip2-qiime2-amplicon-2026.4
channels:
    - https://packages.qiime2.org/qiime2/2026.4/qiime2/released/
    - conda-forge
    - bioconda
dependencies:
    - rachis-qiime2
    - r-remotes
    - r-svglite
    - r-gt
    - r-s7
    # r-clock is a problematic qSIP2 dependency on macOS, including it
    # here so that we can use conda's binaries
    - r-clock
    - rpy2
    - pip
    - pip:
          - q2-qsip2@git+https://github.com/caporaso-lab/q2-qsip2.git
